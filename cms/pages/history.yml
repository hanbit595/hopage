# 연혁 페이지(/page/history.html) 내용. build/cms_pages.py 가 읽어 페이지를 만든다.
# 화면 모양(레이아웃)은 그대로이고, 아래 목록만 바꾸면 된다.
#
# periods        : 기간 묶음. 화면에 위에서부터 이 순서로 나온다(첫째 묶음은 사진 왼쪽, 둘째는 사진 오른쪽 … 번갈아)
#   title        : 기간 제목 (필수. 사진 위 큰 글자, 예: Now - 2020)
#   anchor       : 주소 이름표 (선택. 영문·숫자·-·_ 만. 페이지 안 바로가기용 id, 비우면 his-1, his-2 …)
#   image        : 기간 사진 (필수. /로 시작하는 사이트 안 주소, 파일이 실제로 있어야 함)
#   years        : 연도 목록. 적은 순서와 상관없이 큰 연도가 위로 정렬된다
#     year       : 연도 (필수. 4자리 숫자, 예: 2026)
#     months     : 월 목록. 큰 달이 위로 정렬된다
#       month    : 월 (필수. "01"~"12", 따옴표로 감싸기)
#       items    : 그 달의 내용 (1개 이상). 한 달에 2개를 적으면 한 줄에 2칸으로 나온다
#                  <br> 로 줄을 나눌 수 있다. 여러 줄로 적으려면 |- 를 쓰고 다음 줄부터 들여써서 적는다
# 칸이 틀리면(필수 칸 누락, 연도·월 형식 오류, 없는 이미지) 빌드가 멈추고 한국어로 이유를 알려 준다.

