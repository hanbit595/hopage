# 한글 메뉴(상단 메가메뉴·모바일 메뉴·경로 드롭다운·하위 탭 공통). build/build.py 가 읽어 templates/_menu_ko.html 로 만든다.
# - link: /로 시작하면 사이트 안 주소(빌드 때 public/ 에 없으면 빌드 실패), http로 시작하면 외부 주소
# - 대메뉴 link 를 비우면 첫 번째 노출(visible: true) 소메뉴 주소로 이동한다
