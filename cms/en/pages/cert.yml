# 영문 인증 및 수상 페이지(/en/page/cert.html) 내용. build/cms_pages.py 가 읽어 페이지를 만든다.
# 국문(cms/pages/cert.yml)과 완전히 분리된 영문 전용 파일이다. 이미지 파일은 국문과 같이 써도 되고, 글자는 여기만 고친다.
# 화면 모양(레이아웃)은 그대로이고, 아래 목록만 바꾸면 된다.
#
# categories : 구분(묶음) 이름과 화면에 나오는 순서. 항목의 category 는 이 중 하나와 똑같이 적는다.
# items      : 인증서·상장 한 장마다 한 묶음(- 로 시작)
#   category : 구분 (필수. Awards / Certifications / Patents)
#   name     : 명칭 (필수. 사진 아래에 나오는 영문 글자)
#   issuer   : 발급기관 (선택. 기록용, 지금 화면에는 나오지 않음)
#   date     : 날짜 (선택. 기록용, YYYY-MM-DD 또는 YYYY-MM. 예: 2024-03-15)
#   image    : 인증서 이미지 (필수. /로 시작하는 사이트 안 주소, 파일이 실제로 있어야 함)
#   visible  : 노출 (true = 보임, false = 숨김. 비우면 보임)
#   order    : 순서 (같은 구분 안에서 작은 숫자가 먼저. 같으면 이 파일에 적힌 순서)
# 칸이 틀리면(필수 칸 누락, 날짜 형식 오류, 없는 이미지) 빌드가 멈추고 한국어로 이유를 알려 준다.

