# Contact 페이지(/page/location.html) 내용. build/cms_pages.py 가 읽어 페이지를 만든다.
# 주소·연락처·메일은 여기 적지 않는다. cms/settings/site.yml(회사정보, 하단 푸터와 같은 원본)의 값을 그대로 쓴다.
#   - 주소: site.yml offices 중 office 칸과 이름(name)이 같은 사업장의 address
#   - 연락처: site.yml tel 을 국내 표기로 바꿔 씀(+82-51-913-0120 → 051-913-0120)
#   - 메일: site.yml email
#
# locations   : 화면에 나오는 사업장. 이 순서대로 위에서부터 나온다
#   office    : 연결할 site.yml 사업장 이름 (필수. site.yml offices 의 name 과 똑같이)
#   label     : 작은 영문 제목 (필수. 예: Headquarters. & 등 HTML 그대로)
#   title     : 사업장 이름 (필수. 예: 한빛이노텍 본사)
#   map       : 구글 지도 삽입 주소 (필수. 구글 지도 > 공유 > 지도 퍼가기 의 src="…" 안의 주소.
#               https://www.google.com/maps/embed 로 시작. 지도 좌표·주소 글자가 이 주소 안에 함께 들어 있다)
#   map_indent: 기존 화면과 글자 하나까지 똑같이 맞추려고 둔 들여쓰기 칸 수 (선택. 화면에는 영향 없음, 지워도 됨)
# 칸이 틀리면(필수 칸 누락, site.yml 에 없는 사업장, 지도 주소 형식) 빌드가 멈추고 한국어로 이유를 알려 준다.

