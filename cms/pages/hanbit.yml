# 회사소개 페이지(/page/hanbit.html) 내용. build/cms_pages.py 가 읽어 페이지를 만든다.
# 화면 모양(레이아웃)·움직임은 그대로이고, 아래 글자·사진만 바꾸면 된다.
# 문단 칸: 여러 줄로 적으려면 |- 다음 줄부터 들여써서 적는다. <br>(줄바꿈)·<b>(굵게) 같은 HTML 을 쓸 수 있다.
# 사진 칸: /로 시작하는 사이트 안 주소(파일이 실제로 있어야 함).
# 칸 개수(문단 3개·사진 6장·뒤쪽 문단 2개)는 화면 움직임 스크립트와 맞물려 있어 바꿀 수 없다(다르면 빌드가 멈춤).
# 숫자 칸: 이 페이지에는 숫자 표시 영역이 없다.

# 1) 맨 위 큰 화면
hero:
  title: HANBIT INNOTECH                  # 큰 제목 (필수)
  image: /theme/basic/images/sub/hanbit_about.png   # 배경 사진 (필수)

# 2) 검은 화면에 차례로 나오는 문단 3개 (필수, 꼭 3개)
intro_texts:
  - |-
    한빛이노텍은 단순한 에너지 기업이 아닙니다.<br>
    우리는 사람들이 살아가고, 배우고, 꿈꾸는 공간에 <br>
    깨끗한 에너지와 따뜻한 연결을 전합니다.
  - |-
    태양광 발전 시스템의 설계, 감리, 시공, 제조, 검사, 유지보수까지  <br>
    전 과정을 아우르는 원스톱 에너지 솔루션을 제공하며, <br>
    공공기관과 민간 분야에서 다양한 프로젝트를 성공적으로 수행해왔습니다. 
  - |-
    우리가 만드는 에너지는 단순한 전력이 아닙니다. <br>
    그 안에는 사람과 환경을 향한 약속이 담겨 있습니다.

# 3) 문단과 함께 올라오는 사진 6장 (필수, 꼭 6장. 2장씩 3단: 1·2 → 3·4 → 5·6)
