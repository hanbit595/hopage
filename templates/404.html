<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 | HANBIT Innotech</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: #f5f6f8; color: #222; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 96px 16px; text-align: center; }
  .logo { font-weight: 800; font-size: 28px; letter-spacing: .04em; color: #1b3a8a; }
  h1 { font-size: 22px; margin: 32px 0 12px; }
  p { line-height: 1.7; color: #555; margin: 0 0 8px; }
  .moving { color: #1b3a8a; font-weight: 600; }
  .links { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .links a { display: inline-block; padding: 10px 20px; border-radius: 999px; background: #1b3a8a; color: #fff; text-decoration: none; }
  .links a.sub { background: #fff; color: #1b3a8a; border: 1px solid #1b3a8a; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">HANBIT</div>
  <h1 id="t">페이지를 찾을 수 없습니다</h1>
  <p id="m">요청하신 주소의 페이지가 없거나 주소가 바뀌었습니다.<br>Page not found.</p>
  <div class="links">
    <a id="home" href="/">홈으로</a>
    <a id="home_en" class="sub" href="/en/index.html">English</a>
  </div>
</div>
<script>
/* 옛 주소(그누보드 .php) → 새 주소 이동. 표: redirects.json (빌드 때 생성)
   임시 주소(github.io/저장소이름/)와 최종 도메인(/) 양쪽에서 동작하도록 사이트 시작 경로를 찾는다 */
(function () {
  var BASES = {{ bases }};
  var KEEP = ["bo_table", "wr_id", "page", "no", "locale", "co_id"];
  var path = location.pathname, base = "/";
  for (var i = 0; i < BASES.length; i++) {
    if (path.indexOf(BASES[i]) === 0) { base = BASES[i]; break; }
  }
  document.getElementById("home").href = base;
  document.getElementById("home_en").href = base + "en/index.html";
  var rest = "/" + path.slice(base.length);
  var params = {};
  location.search.replace(/^\?/, "").split("&").forEach(function (kv) {
    if (!kv) return;
    var p = kv.split("="), k = decodeURIComponent(p[0]), v = decodeURIComponent((p[1] || "").replace(/\+/g, " "));
    if (KEEP.indexOf(k) > -1 && v !== "") params[k] = v;
  });
  if (params.wr_id) delete params.page;   // 글 주소에 붙은 목록 쪽 번호는 무시(원본도 같은 글)
  function key(ps) {
    var ks = Object.keys(ps).sort();
    return rest + (ks.length ? "?" + ks.map(function (k) { return k + "=" + ps[k]; }).join("&") : "");
  }
  fetch(base + "redirects.json").then(function (r) { return r.json(); }).then(function (map) {
    var to = map[key(params)];
    if (!to && params.locale) { var p2 = {}; for (var k in params) if (k !== "locale") p2[k] = params[k]; to = map[key(p2)]; }
    if (!to && params.bo_table) {             // 없는 글 번호 등 → 그 게시판 목록
      to = map[rest + "?bo_table=" + params.bo_table];
    }
    if (!to) {                                // 없는 새 주소의 글·목록 쪽(지운 글 등) → 그 게시판 목록
      var mb = rest.match(/^\/((?:en\/)?board\/[\w-]+\/)(?:\d+|page-\d+)\.html$/);
      if (mb) to = mb[1] + "index.html";
    }
    if (!to && /\.php$/.test(rest)) {         // 그 밖의 옛 .php 주소(로그인·관리자 등) → 홈
      to = params.locale === "en_US" ? "en/index.html" : "index.html";
    }
    if (to) {
      document.getElementById("t").textContent = "새 주소로 이동합니다";
      document.getElementById("m").innerHTML = '<span class="moving">' + base + to + "</span>";
      location.replace(base + to);
    }
  }).catch(function () { /* 표를 못 읽으면 안내만 보여 준다 */ });
})();
</script>
</body>
</html>
