# ESG 경영 페이지(/page/esg.html) 내용. build/cms_pages.py 가 읽어 페이지를 만든다.
# 화면 모양(레이아웃)은 그대로이고, 아래 글자·아이콘·목록만 바꾸면 된다.
# 문단 칸: 여러 줄로 적으려면 |- 다음 줄부터 들여써서 적는다. <br>(줄바꿈) 같은 HTML 을 쓸 수 있다.
# 제목 칸: 글자 그대로 나온다(HTML 안 됨).
# 이미지 칸: /로 시작하는 사이트 안 주소(파일이 실제로 있어야 함).
# 맨 위 큰 화면 문구(에너지를 넘어, …)는 여러 페이지 공통 문구라 여기서 바꾸지 않는다.

# 1) 소개 (필수)
intro:
  title: 지속가능한 내일을 설계합니다        # 소개 제목
  text: |-                                   # 소개 문단
    한빛이노텍은 기술과 책임, 그리고 신뢰를 바탕으로 <br>
    환경(E) · 사회(S) · 지배구조(G)가 균형을 이루는 지속가능한 에너지 경영을 실천합니다.

# 2) 원 위로 흐르는 글자 (필수)
flow_text: "HANBIT’S ENVIRONMENT·SOCIAL·GOVERNANCE"

# 3) 원 3개 (E·S·G). 위에서부터 왼쪽→오른쪽 순서
pillars:
  - title: Environment                                # 원 제목 (필수)
    icon: /theme/basic/images/sub/esg_ico_01.png      # 아이콘 (필수)
    text: |-                                          # 설명 (필수)
      BIPV · ESS · 재활용 기술로 <br>
      실현하는 탄소중립
  - title: Social
    icon: /theme/basic/images/sub/esg_ico_02.png
    text: |-
      공공 프로젝트 · 교육 · 사회 <br>
      공헌으로 상생 실현
  - title: Governance
    icon: /theme/basic/images/sub/esg_ico_03.png
    text: |-
      윤리 · 공정 · ESG 기반 <br>
      경영 체계 구축

# 4) 아래 상세 상자. 상자마다 제목 1개 + 항목 목록
details:
  - title: 친환경 에너지로 만드는 지속 가능한 미래     # 상자 제목 (필수)
    items:                                            # 항목 목록 (1개 이상)
      - 건물 일체형 태양광(BIPV), 에너지 저장 시스템(ESS) 구축
      - 사용 후 태양광 패널 및 배터리 재활용
      - 자원 순환형 에너지 생태계 조성
  - title: 지역사회와 함께하는 에너지 전환
    items:
      - 공공 부문 에너지 복지 프로젝트 참여
      - 태양광 교육 프로그램 운영
      - 지역 사회공헌 활동 지속
  - title: 투명성과 신뢰 중심의 지속가능 경영
    items:
      - 법규 준수 및 윤리경영 실천
      - 체계적이고 공정한 의사결정 구조
      - ESG 경영을 통한 사회적 책임 강화
  - title: 기술로 앞서가는 지속 가능 에너지
    items:
      - 고효율 태양광 발전 기술 개발
      - ESS 연계 재생에너지 활용 확대
      - 스마트 기술로 생산·저장·활용 전 과정 최적화
