# 영문 회사소개 페이지(/en/page/hanbit.html) 내용. build/cms_pages.py 가 읽어 페이지를 만든다.
# 국문(cms/pages/hanbit.yml)과 완전히 분리된 영문 전용 파일이다. 사진 파일은 국문과 같이 써도 되고, 글자는 여기만 고친다.
# 화면 모양(레이아웃)·움직임은 그대로이고, 아래 글자·사진만 바꾸면 된다.
# 문단 칸: 여러 줄로 적으려면 |- 다음 줄부터 들여써서 적는다. <br>(줄바꿈)·<b>(굵게) 같은 HTML 을 쓸 수 있다.
# 사진 칸: /로 시작하는 사이트 안 주소(파일이 실제로 있어야 함).
# 칸 개수(문단 3개·사진 6장·뒤쪽 문단 2개)는 화면 움직임 스크립트와 맞물려 있어 바꿀 수 없다(다르면 빌드가 멈춤).
# 숫자 칸: 이 페이지에는 숫자 표시 영역이 없다.
# 국문과 다른 점: 영문 맨 위 큰 화면은 사진이 아니라 동영상이다(hero.video).

# 1) 맨 위 큰 화면
hero:
  title: "HANBIT INNOTECH"                  # 큰 제목 (필수)
  video: /theme/basic/images/sub/hanbit_about.mov   # 배경 동영상 (필수. /로 시작하는 사이트 안 주소, .mov 는 빌드가 .mp4 로 바꾼 파일을 씀)

# 2) 검은 화면에 차례로 나오는 문단 3개 (필수, 꼭 3개)
intro_texts:
  - |-
    HANBIT Innotech is more than just an energy company.<br> We deliver clean
    energy and meaningful connectivity to the spaces <br> where people live, learn, and dream.
  - |-
    From design, supervision, and construction to manufacturing, inspection,
    and maintenance, we provide comprehensive, one-stop energy solutions that cover the entire
    lifecycle, successfully executing a wide range of projects across both public and private sectors.
  - |-
    The energy we create is more than just electricity. <br> It embodies our
    commitment to both people and the environment.

# 3) 문단과 함께 올라오는 사진 6장 (필수, 꼭 6장. 2장씩 3단: 1·2 → 3·4 → 5·6)
photos:
  - /theme/basic/images/sub/hanbit_box_01_01.jpg
  - /theme/basic/images/sub/hanbit_box_01_02.jpg
  - /theme/basic/images/sub/hanbit_box_02_01.jpg
  - /theme/basic/images/sub/hanbit_box_02_02.jpg
  - /theme/basic/images/sub/hanbit_box_03_01.jpg
  - /theme/basic/images/sub/hanbit_box_03_02.jpg

# 4) 넓은 배경 사진 위 문단 (필수. 배경 사진은 디자인(CSS)에 고정)
energy_text: |-
  Through clean energy, we build better lives <br />and a sustainable
  tomorrow.

# 5) 해 사진 옆 문단 2개 (필수, 꼭 2개. 사진은 디자인(CSS)에 고정)
sun_texts:
  - |-
    Implementing efficient designs through smart technologies, we provide seamless
    services from initial design to long-term maintenance. <br> Commitment to environmental and social
    responsibility drives our pursuit of sustainable value.
  - |-
    HANBIT Innotech is venturing into next-generation energy sectors, including tailored
    RE100 solutions, BIPV, and smart energy platforms, positioning ourselves as a trusted partner for our
    clients and society.

# 6) 마지막 문장 (필수)
ending_text: |-
  The energy we deliver is <br>
  <b>a bright promise for a sustainable tomorrow.</b>
