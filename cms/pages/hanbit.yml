# 4) 넓은 배경 사진 위 문단 (필수. 배경 사진은 디자인(CSS)에 고정)
energy_text: |-
  깨끗한 에너지를 통해 더 나은 삶과 <br>
  지속가능한 내일을 만듭니다.

# 5) 해 사진 옆 문단 2개 (필수, 꼭 2개. 사진은 디자인(CSS)에 고정)
sun_texts:
  - |-
    스마트한 기술로 효율적인 설계를 구현하고,<br>
    설계부터 유지보수까지 끊김 없는 서비스를 제공합니다.<br>
    환경과 사회적 책임을 함께 고려한<br>
    지속가능한 가치를 추구합니다.
  - |-
    한빛이노텍은 RE100 맞춤형 솔루션, BIPV,<br>
    스마트 에너지 플랫폼 등 차세대 에너지 분야에 도전하며<br>
    고객과 사회에 신뢰받는 파트너로 나아가고 있습니다.

# 6) 마지막 문장 (필수)
ending_text: |-
  우리가 전하는 에너지는 <br>
  <b>지속가능한 내일을 향한 밝은 약속</b>입니다.
