# 영문 메뉴(영문 페이지의 상단 메가메뉴·모바일 메뉴·경로 드롭다운·하위 탭 공통). build/build.py 가 읽어 templates/_menu_en.html 로 만든다.
# 국문 cms/settings/menu.yml 과 완전히 분리된 영문 전용 파일이다(국문 메뉴에는 영향 없음).
# - link: /로 시작하면 사이트 안 주소(빌드 때 public/ 에 없으면 빌드 실패), http로 시작하면 외부 주소. 영문 페이지는 /en/… 주소
# - 대메뉴 link 를 비우면 첫 번째 노출(visible: true) 소메뉴 주소로 이동한다
# - visible: false 면 영문 모든 메뉴 형태에서 숨긴다. new_window: true 면 새 창
# - class: 기존 화면 마크업 유지용(menu_05, sub_menu_03 등). 디자인에 쓰이지 않으며, 새 항목은 비워 두면 자동으로 붙는다
