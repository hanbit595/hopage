# 영문 ESG 경영 페이지(/en/page/esg.html) 내용. build/cms_pages.py 가 읽어 페이지를 만든다.
# 국문(cms/pages/esg.yml)과 완전히 분리된 영문 전용 파일이다. 아이콘 파일은 국문과 같이 써도 되고, 글자는 여기만 고친다.
# 화면 모양(레이아웃)은 그대로이고, 아래 글자·아이콘·목록만 바꾸면 된다.
# 문단 칸: 여러 줄로 적으려면 |- 다음 줄부터 들여써서 적는다. <br>(줄바꿈) 같은 HTML 을 쓸 수 있다.
# 제목 칸: 글자 그대로 나온다(HTML 안 됨).
# 이미지 칸: /로 시작하는 사이트 안 주소(파일이 실제로 있어야 함).
# 맨 위 큰 화면 문구는 여러 페이지 공통 문구라 여기서 바꾸지 않는다.
# 상세 상자 항목 앞의 '-' 는 화면 틀이 붙이므로 여기에는 적지 않는다.

# 1) 소개 (필수)
intro:
  title: "Designing a Sustainable Tomorrow"   # 소개 제목
  text: |-
    HANBIT Innotech practices sustainable energy management <br/>
    where Environment (E), Social (S), and Governance (G) are in balance,<br/>
     grounded in technology, responsibility, and trust.

# 2) 원 위로 흐르는 글자 (필수)
flow_text: "HANBIT’S ENVIRONMENT · SOCIAL · GOVERNANCE"

# 3) 원 3개 (E·S·G). 위에서부터 왼쪽→오른쪽 순서
pillars:
  - title: "Environment"                              # 원 제목 (필수)
    icon: /theme/basic/images/sub/esg_ico_01.png      # 아이콘 (필수)
    text: |-                                          # 설명 (필수)
      Achieving Carbon Neutrality through <br> 
      BIPV · ESS · Recycling Technologies
  - title: "Social"
    icon: /theme/basic/images/sub/esg_ico_02.png
    text: |-
      Creating Shared Value through <br> 
      Public Projects · Education · <br/>
      Social Contribution
  - title: "Governance"
    icon: /theme/basic/images/sub/esg_ico_03.png
    text: |-
      Establishing an Ethical, Fair, <br> 
      ESG-Based Management System

# 4) 아래 상세 상자. 상자마다 제목 1개 + 항목 목록
details:
  - title: "A Sustainable Future Powered by Eco-friendly Energy"     # 상자 제목 (필수)
    items:                                            # 항목 목록 (1개 이상)
      - "Building Integrated Photovoltaics (BIPV) and Energy Storage System (ESS)"
      - "Recycling of end-of-life solar panels and batteries"
      - "Creating a resource-circulating energy ecosystem"
  - title: "Energy Transition Together with the Community"
    items:
      - "Public sector energy welfare projects"
      - "Solar energy education programs"
      - "Ongoing community contribution initiatives"
  - title: "Establishing a Governance Framework built on Ethics, Fairness, and ESG Principles"
    items:
      - "Compliance with regulations and ethical management"
      - "Structured and fair decision-making process"
      - "Strengthening social responsibility through ESG management"
  - title: "Realization of ESG Management"
    items:
      - "Simultaneously strengthens eco-friendly brand image and fulfills social responsibility"
      - "High-efficiency solar power technology development"
      - "Optimization of energy production, storage, and utilization through smart technologies"
